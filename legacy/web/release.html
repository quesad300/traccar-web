<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Transportes Fraylescanos</title>
    <link rel="icon" sizes="192x192" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo.svg">
    <link rel="stylesheet" href="app.css">
    <style>
        .ol-popup {
        position: absolute;
        background-color: white;
        box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #cccccc;
        bottom: 12px;
        left: -50px;
        min-width: 280px;
        }
        .ol-popup:after, .ol-popup:before {
        top: 100%;
        border: solid transparent;
        content: " ";
        height: 0;
        width: 0;
        position: absolute;
        pointer-events: none;
        }
        .ol-popup:after {
        border-top-color: white;
        border-width: 10px;
        left: 48px;
        margin-left: -10px;
        }
        .ol-popup:before {
        border-top-color: #cccccc;
        border-width: 11px;
        left: 48px;
        margin-left: -11px;
        }
        .ol-popup-closer {
        text-decoration: none;
        position: absolute;
        top: 15px;
        right: 20px;
        }
        .ol-popup-closer:after {
        content: "✖";
        }
        .hidden{
        display:none;
        }
    </style>
</head>
<body>
    <div id="popupmap" class="ol-popup hidden">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
    </div>
    <div id="spinner"></div>
    <div id="attribution">Powered by <a href="https://www.traccar.org/" target="_blank">Traccar GPS Tracking System</a></div>
    <script id="loadScript" src="load.js"></script>
</body>
</html>
