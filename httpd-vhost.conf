<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex release.html

    <Directory "/usr/local/apache2/htdocs">
        Require all granted
        AllowOverride None
    </Directory>

    ProxyPass /api/socket ws://respaldotransportes.ddns.net/api/socket
    ProxyPassReverse /api/socket ws://respaldotransportes.ddns.net/api/socket

    ProxyPass /api http://respaldotransportes.ddns.net/api
    ProxyPassReverse /api http://respaldotransportes.ddns.net/api
</VirtualHost>
